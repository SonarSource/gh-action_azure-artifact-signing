name: Pre-commit

on:
  pull_request:

permissions:
  id-token: write  # Required by SonarSource/ci-github-actions/config-npm for private npm auth
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: sonar-xs
    steps:
      - uses: SonarSource/ci-github-actions/config-npm@v2
      - uses: SonarSource/gh-action_pre-commit@1181d422cbd3380624656c4dc46f6172263c0418 # 2.0.0
        with:
          extra-args: >
            --from-ref=origin/${{ github.event.pull_request.base.ref }}
            --to-ref=${{ github.event.pull_request.head.sha }}
