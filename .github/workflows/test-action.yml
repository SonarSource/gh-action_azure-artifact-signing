name: Test

on:
  push:
    branches:
      - master
      - v*
  pull_request:

jobs:
  test-signing:
    runs-on: sonar-xs
    name: Test signing
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4.2.4
        with:
          cache: true
          tool_versions: |
            java temurin-21

      - name: Create test artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cat <<'EOF' > artifacts/hello.ps1
          Write-Host "Hello from signed script"
          EOF
          cat <<'EOF' > artifacts/goodbye.ps1
          Write-Host "Goodbye from signed script"
          EOF

      - name: Sign test artifacts
        uses: ./
        with:
          files: "artifacts/*.ps1"
          signing-profile: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'v')) && 'release' || 'test' }}

  test-setup-mode:
    runs-on: sonar-xs
    name: Test setup mode
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup signing environment only
        uses: ./
        with:
          mode: setup
          signing-profile: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'v')) && 'release' || 'test' }}

      - name: Verify exported environment variables
        shell: bash
        run: |
          [[ "${SIGNING_ENDPOINT:?}" == "https://weu.codesigning.azure.net" ]]
          [[ "${SIGNING_ACCOUNT:?}" == codesigning-* ]]
          [[ "${SIGNING_PROFILE:?}" == sonarsource-* ]]
          : "${ACCESS_TOKEN:?}"
